<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Agent</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --text:#e6e6e6; --muted:#8a8f98; --accent:#4f8cff; --danger:#b8433c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:0; border-bottom:1px solid #262a33; }
  .tab { padding:12px 20px; cursor:pointer; color:var(--muted); }
  .tab.active { color:var(--text); border-bottom:2px solid var(--accent); }
  .view { flex:1; display:none; overflow:auto; padding:20px; }
  .view.active { display:flex; flex-direction:column; }

  /* chat */
  .chat-toolbar { display:flex; gap:8px; justify-content:flex-end; max-width:700px; margin:0 auto 10px; width:100%; }
  .chat-toolbar button { background:var(--panel); border:1px solid #333; }
  .chat-toolbar button.danger { color:#ff8f8a; }
  #messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; max-width:700px; margin:0 auto; width:100%; }
  .msg { padding:10px 14px; border-radius:10px; max-width:80%; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--accent); }
  .msg.assistant { align-self:flex-start; background:var(--panel); }
  #chat-form { display:flex; gap:8px; max-width:700px; margin:16px auto 0; width:100%; }
  input, button, textarea { font:inherit; }
  #chat-input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #333; background:var(--panel); color:var(--text); }
  button { padding:10px 16px; border-radius:8px; border:none; background:var(--accent); color:white; cursor:pointer; }

  /* spinner */
  .spinner-dots { display:inline-flex; gap:4px; align-items:center; }
  .spinner-dots span { width:6px; height:6px; border-radius:50%; background:var(--muted); animation: pulse 1s infinite ease-in-out; }
  .spinner-dots span:nth-child(2) { animation-delay:0.15s; }
  .spinner-dots span:nth-child(3) { animation-delay:0.3s; }
  @keyframes pulse { 0%,80%,100% { opacity:0.25; transform:scale(0.8);} 40% { opacity:1; transform:scale(1);} }

  /* bills */
  .bills-form { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; color:var(--muted); }
  .field input { padding:8px 10px; border-radius:6px; border:1px solid #333; background:var(--panel); color:var(--text); }
  input[type="date"] { color-scheme: dark; }
  #bills-dir { padding:8px 10px; border-radius:6px; border:1px solid #333; background:var(--panel); color:var(--muted); min-width:200px; }
  #bills-sender { min-width:100px; }
  #bills-offset { width:90px; }
  #bills-browse { white-space:nowrap; }
  .bills-options { display:flex; align-items:center; gap:6px; margin-top:12px; }
  .bills-options label { font-size:13px; color:var(--muted); cursor:pointer; }
  #bills-result { margin-top:20px; max-width:900px; }
  .total { font-size:28px; font-weight:600; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid #262a33; }
  .muted { color:var(--muted); }
  .ignored-section { margin-top:28px; }
  .ignored-section h4 { margin-bottom:4px; }
  .ignored-section .hint { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .ignored-include-btn { margin-top:10px; background:var(--panel); border:1px solid #333; }

  /* entries page */
  .entries-form { display:flex; gap:10px; flex-wrap:wrap; align-items:end; max-width:700px; }
  #entries-total { width:120px; }
  .entries-table-wrap { max-width:700px; margin-top:24px; }
  .entries-table-wrap td.amount, .entries-table-wrap th.amount { text-align:right; }
  .del-btn { background:transparent; border:1px solid #333; color:#ff8f8a; padding:4px 10px; font-size:12px; }
  tfoot td { font-weight:600; border-top:2px solid #333; border-bottom:none; }
</style>
</head>
<body>

<header>
  <div class="tab active" data-view="chat">Chat</div>
  <div class="tab" data-view="bills">Bills</div>
  <div class="tab" data-view="entries">Entries</div>
</header>

<section id="chat" class="view active">
  <div class="chat-toolbar">
    <button id="chat-clear" type="button">Clear</button>
    <button id="chat-reset-memory" type="button" class="danger">Reset Memory</button>
  </div>
  <div id="messages"></div>
  <form id="chat-form">
    <input id="chat-input" placeholder="Message the agent…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</section>

<section id="bills" class="view">
  <div class="bills-form">
    <div class="field">
      <label>Folder</label>
      <button id="bills-browse" type="button">📁 Choose folder…</button>
    </div>
    <div class="field" style="flex-grow:1;">
      <label>Selected</label>
      <input id="bills-dir" readonly placeholder="No folder selected" />
    </div>
    <div class="field">
      <label>Sender</label>
      <input id="bills-sender" value="Bhavya Mart Akshar Elementa" />
    </div>
    <div class="field">
      <label>Start date (optional)</label>
      <input id="bills-start" type="date" />
    </div>
    <div class="field">
      <label>End date</label>
      <input id="bills-end" type="date" />
    </div>
    <div class="field">
      <label>Offset</label>
      <input id="bills-offset" type="number" step="any" value="0" />
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button id="bills-submit">Calculate</button>
    </div>
  </div>
  <div class="bills-options">
    <input type="checkbox" id="bills-read-photos" />
    <label for="bills-read-photos">🔍 Read photo bills with AI (slower — one model call per image)</label>
  </div>
  <div id="bills-result"></div>
</section>

<section id="entries" class="view">
  <div class="entries-form">
    <div class="field">
      <label>Start date</label>
      <input id="entries-start" type="date" />
    </div>
    <div class="field">
      <label>End date</label>
      <input id="entries-end" type="date" />
    </div>
    <div class="field">
      <label>Total amount</label>
      <input id="entries-total" type="number" step="any" placeholder="0" />
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button id="entries-save">Save</button>
    </div>
  </div>
  <div id="entries-error" style="color:#ff6b6b; margin-top:8px;"></div>

  <div class="entries-table-wrap">
    <table>
      <thead>
        <tr><th>Start date</th><th>End date</th><th class="amount">Total amount</th><th></th></tr>
      </thead>
      <tbody id="entries-tbody"></tbody>
      <tfoot>
        <tr><td colspan="2">Grand total</td><td class="amount" id="entries-grand-total">₹0.00</td><td></td></tr>
      </tfoot>
    </table>
  </div>
</section>

<script>
const sessionId = "default";

// ---------- Chat ----------
const messagesEl = document.getElementById("messages");
const form = document.getElementById("chat-form");
const input = document.getElementById("chat-input");

function addBubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addSpinnerBubble() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = '<span class="spinner-dots"><span></span><span></span><span></span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function loadHistory() {
  const res = await fetch(`/api/history/${sessionId}`);
  const history = await res.json();
  history.forEach(m => { if (m.role !== "system") addBubble(m.role, m.content); });
}
loadHistory();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addBubble("user", text);
  input.value = "";

  const assistantBubble = addSpinnerBubble();
  let spinnerCleared = false;

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, message: text }),
  });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    if (!spinnerCleared) {
      assistantBubble.textContent = "";
      spinnerCleared = true;
    }
    assistantBubble.textContent += decoder.decode(value, { stream: true });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
});

document.getElementById("chat-clear").addEventListener("click", () => {
  messagesEl.innerHTML = "";
});

document.getElementById("chat-reset-memory").addEventListener("click", async () => {
  if (!confirm("This deletes all stored chat history for this session. Continue?")) return;
  await fetch(`/api/memory/${sessionId}`, { method: "DELETE" });
  messagesEl.innerHTML = "";
});

// ---------- Bills ----------

document.getElementById("bills-end").valueAsDate = new Date();

document.getElementById("bills-browse").addEventListener("click", async () => {
  const dirField = document.getElementById("bills-dir");
  try {
    const res = await fetch("/api/pick-folder", { method: "POST" });
    if (!res.ok) return;
    const data = await res.json();
    dirField.value = data.path;
  } catch (err) {
    console.error(err);
  }
});

// Holds the current calculation's state client-side so "Include" can move
// rows between lists and recompute the total without another server call.
let billsState = null; // { total, offset, entries: [...], ignored: [...] }

function renderBillResult() {
  const resultEl = document.getElementById("bills-result");
  const { total, offset, entries, ignored } = billsState;

  let html = `<div class="total">Total: ₹${total.toFixed(2)}</div>`;
  if (offset) html += `<p class="muted">Includes offset of ₹${offset}</p>`;
  html += `<table><tr><th>Time</th><th>Type</th><th>Amount</th><th>Details</th></tr>`;
  entries.forEach(e => {
    const amt = e.amount === null ? '<span class="muted">not read</span>' : `₹${e.amount}`;
    html += `<tr><td>${e.timestamp.replace("T"," ")}</td><td>${e.type}</td><td>${amt}</td><td>${e.detail}</td></tr>`;
  });
  html += `</table>`;

  html += `<div class="ignored-section"><h4>Ignored (${ignored.length})</h4>`;
  if (ignored.length) {
    html += `<div class="hint">Marked "pending" and excluded from the total. Check any you want counted, then hit Include.</div>`;
    html += `<table><tr><th></th><th>Time</th><th>Would-be amount</th><th>Message</th></tr>`;
    ignored.forEach((e, i) => {
      html += `<tr><td><input type="checkbox" class="ignored-check" data-idx="${i}" /></td><td>${e.timestamp.replace("T"," ")}</td><td>₹${e.amount}</td><td>${e.detail}</td></tr>`;
    });
    html += `</table><button class="ignored-include-btn" id="ignored-include-btn" type="button">Include selected</button>`;
  } else {
    html += `<p class="muted">None.</p>`;
  }
  html += `</div>`;

  resultEl.innerHTML = html;

  const includeBtn = document.getElementById("ignored-include-btn");
  if (includeBtn) {
    includeBtn.addEventListener("click", () => {
      const checked = Array.from(document.querySelectorAll(".ignored-check:checked"))
        .map(cb => parseInt(cb.dataset.idx, 10));
      if (!checked.length) return;

      // move selected ignored rows into entries (as "message" type), add their amounts to total
      const toMove = checked.map(i => billsState.ignored[i]);
      toMove.forEach(e => {
        billsState.entries.push({ timestamp: e.timestamp, type: "message", amount: e.amount, detail: e.detail });
        billsState.total += e.amount;
      });
      billsState.entries.sort((a, b) => a.timestamp.localeCompare(b.timestamp));
      billsState.ignored = billsState.ignored.filter((_, i) => !checked.includes(i));

      renderBillResult();
    });
  }
}

document.getElementById("bills-submit").addEventListener("click", async () => {
  const directory = document.getElementById("bills-dir").value.trim();
  const sender = document.getElementById("bills-sender").value.trim();
  const start_date = document.getElementById("bills-start").value || null;
  const end_date = document.getElementById("bills-end").value || null;
  const read_photos = document.getElementById("bills-read-photos").checked;
  const offset = parseFloat(document.getElementById("bills-offset").value) || 0;
  const resultEl = document.getElementById("bills-result");
  resultEl.innerHTML = "<p class='muted'>Calculating…</p>";
  billsState = null;

  try {
    const res = await fetch("/api/bills/summarize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ directory, sender, start_date, end_date, read_photos, offset }),
    });
    if (!res.ok) {
      const err = await res.json();
      resultEl.innerHTML = `<p style="color:#ff6b6b">${err.detail}</p>`;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let errored = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const evt = JSON.parse(line);
        if (evt.type === "progress") {
          resultEl.innerHTML = `<p class="muted">Reading photo bills… ${evt.current}/${evt.total}</p>`;
        } else if (evt.type === "error") {
          resultEl.innerHTML = `<p style="color:#ff6b6b">${evt.detail}</p>`;
          errored = true;
        } else if (evt.type === "result") {
          billsState = evt;
        }
      }
    }

    if (!errored && billsState) renderBillResult();
  } catch (err) {
    resultEl.innerHTML = `<p style="color:#ff6b6b">${err}</p>`;
  }
});

// ---------- Entries ----------

async function loadEntries() {
  const res = await fetch("/api/entries");
  const entries = await res.json();
  const tbody = document.getElementById("entries-tbody");
  tbody.innerHTML = "";
  let grandTotal = 0;
  entries.forEach(e => {
    grandTotal += e.total_amount;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${e.start_date}</td>
      <td>${e.end_date}</td>
      <td class="amount">₹${e.total_amount.toFixed(2)}</td>
      <td><button class="del-btn" data-id="${e.id}">Delete</button></td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById("entries-grand-total").textContent = `₹${grandTotal.toFixed(2)}`;

  tbody.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      await fetch(`/api/entries/${btn.dataset.id}`, { method: "DELETE" });
      loadEntries();
    });
  });
}
loadEntries();

document.getElementById("entries-save").addEventListener("click", async () => {
  const start_date = document.getElementById("entries-start").value;
  const end_date = document.getElementById("entries-end").value;
  const total_amount = parseFloat(document.getElementById("entries-total").value);
  const errEl = document.getElementById("entries-error");
  errEl.textContent = "";

  if (!start_date || !end_date || isNaN(total_amount)) {
    errEl.textContent = "Please fill in start date, end date, and total amount.";
    return;
  }

  await fetch("/api/entries", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ start_date, end_date, total_amount }),
  });

  document.getElementById("entries-start").value = "";
  document.getElementById("entries-end").value = "";
  document.getElementById("entries-total").value = "";
  loadEntries();
});

// ---------- Tabs ----------
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.view).classList.add("active");
  });
});
</script>
</body>
</html>
